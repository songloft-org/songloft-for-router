name: Release OpenWrt packages

on:
  push:
    tags:
      - 'openwrt-*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Create release when it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPOSITORY" --title "$TAG" --generate-notes
          fi

  openwrt-packages:
    name: OpenWrt ${{ matrix.sdk }}-${{ matrix.arch }}
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic
          - arm_cortex-a7
          - arm_cortex-a9
          # Songloft 的 modernc.org/libc SQLite 依赖未提供 MIPS / MIPSel 构建文件。
        # songloft v2.12.1 的 go.mod 使用 Go 1.26 的 tool 指令；
        # OpenWrt 24.10 的 Go 1.23 无法解析，故仅构建内置 Go 1.26 的 25.12。
        sdk:
          - '25.12.5'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Build OpenWrt packages
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEED_DIR: ${{ github.workspace }}/openwrt
          NO_SHFMT_CHECK: true
          # songloft-lite 是 songloft 源包的默认构建变体；SDK Action 只能调用源包目标 package/songloft/*。
          PACKAGES: songloft luci-app-songloft
          V: sc

      - name: Upload packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          package_dir="bin/packages/${ARCH}/action"
          shopt -s nullglob
          # action feed 目录还会包含自动构建的依赖包（如 ca-bundle）；只发布本项目的包。
          packages=(
            "${package_dir}"/songloft-[0-9]*.ipk
            "${package_dir}"/songloft-lite-[0-9]*.ipk
            "${package_dir}"/luci-app-songloft-[0-9]*.ipk
            "${package_dir}"/songloft-[0-9]*.apk
            "${package_dir}"/songloft-lite-[0-9]*.apk
            "${package_dir}"/luci-app-songloft-[0-9]*.apk
          )

          if ((${#packages[@]} == 0)); then
            echo "No packages found in ${package_dir}" >&2
            exit 1
          fi

          for package in "${packages[@]}"; do
            filename=$(basename "$package")
            extension="${filename##*.}"
            stem="${filename%.*}"
            release_name="${stem}_${ARCH}.${extension}"
            cp "$package" "/tmp/${release_name}"
            gh release upload "$TAG" "/tmp/${release_name}" --clobber
          done
