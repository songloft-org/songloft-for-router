name: Release OpenWrt packages

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
  push:
    tags:
      - 'openwrt-*'

permissions:
  contents: write

# Serialize releases for this platform, including calls from the update workflow.
concurrency:
  group: release-openwrt
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Create release when it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if ! gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPOSITORY" --title "$TAG" --generate-notes --verify-tag --draft
          fi

  openwrt-packages:
    name: OpenWrt server ${{ matrix.sdk }}-${{ matrix.arch }}
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic
          - arm_cortex-a7
          - arm_cortex-a9
          # Songloft 的 modernc.org/libc SQLite 依赖未提供 MIPS / MIPSel 构建文件。
        # songloft 的 go.mod 使用 Go 1.26 的 tool 指令；
        # OpenWrt 24.10 的 Go 1.23 无法解析，故服务端仅构建内置 Go 1.26 的 25.12。
        sdk:
          - '25.12.5'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build OpenWrt packages
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEED_DIR: ${{ github.workspace }}/openwrt
          NO_SHFMT_CHECK: true
          # songloft-lite 是 songloft 源包的默认构建变体；SDK Action 只能调用源包目标 package/songloft/*。
          PACKAGES: songloft
          V: sc

      - name: Upload server APKs to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          package_dir="bin/packages/${ARCH}/action"
          shopt -s nullglob
          # action feed 目录还会包含自动构建的依赖包（如 ca-bundle）；只发布本项目的包。
          full=("${package_dir}"/songloft-[0-9]*.apk)
          lite=("${package_dir}"/songloft-lite-[0-9]*.apk)
          if ((${#full[@]} == 0 || ${#lite[@]} == 0)); then
            echo "Missing SongLoft full or lite APK in ${package_dir}" >&2
            exit 1
          fi

          for package in "${full[@]}" "${lite[@]}"; do
            filename=$(basename "$package")
            extension="${filename##*.}"
            stem="${filename%.*}"
            release_name="${stem}_${ARCH}.${extension}"
            cp "$package" "/tmp/${release_name}"
            gh release upload "$TAG" "/tmp/${release_name}" --clobber
          done

  openwrt-luci:
    name: OpenWrt LuCI ${{ matrix.format }} (all)
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: '24.10.8'
            format: ipk
          - sdk: '25.12.5'
            format: apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build universal LuCI packages
        uses: openwrt/gh-action-sdk@v11
        env:
          # LuCI 和翻译包的 PKGARCH 为 all；每种格式只用 x86_64 SDK 构建一次。
          ARCH: x86_64-${{ matrix.sdk }}
          FEED_DIR: ${{ github.workspace }}/openwrt
          NO_SHFMT_CHECK: true
          PACKAGES: luci-app-songloft
          V: sc

      - name: Upload universal LuCI packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
          FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          package_dir="bin/packages/x86_64/action"
          shopt -s nullglob
          # IPK 文件名带 _all；APK 原始文件名不包含架构。
          case "$FORMAT" in
            ipk)
              apps=("${package_dir}"/luci-app-songloft_*_all.ipk)
              translations=("${package_dir}"/luci-i18n-songloft-zh-cn_*_all.ipk)
              ;;
            apk)
              apps=("${package_dir}"/luci-app-songloft-[0-9]*.apk)
              translations=("${package_dir}"/luci-i18n-songloft-zh-cn-[0-9]*.apk)
              ;;
            *)
              echo "Unsupported package format: $FORMAT" >&2
              exit 1
              ;;
          esac
          if ((${#apps[@]} == 0 || ${#translations[@]} == 0)); then
            echo "Missing SongLoft LuCI or Chinese translation ${FORMAT} in ${package_dir}" >&2
            exit 1
          fi

          for package in "${apps[@]}" "${translations[@]}"; do
            filename=$(basename "$package")
            release_name="$filename"
            # APK 也标记为 all，便于在 Release 中识别通用包。
            if [[ "$FORMAT" == apk ]]; then
              release_name="${filename%.apk}_all.apk"
            fi
            cp "$package" "/tmp/${release_name}"
            gh release upload "$TAG" "/tmp/${release_name}" --clobber
          done

  publish:
    name: Publish and retain the latest openwrt release
    needs: [openwrt-packages, openwrt-luci]
    runs-on: ubuntu-latest
    steps:
      # Maintenance scripts come from the workflow revision, not an older release tag.
      - uses: actions/checkout@v4
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
      - name: Remove older releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/prune-releases.py openwrt
