name: Check upstream and build router packages

on:
  schedule:
    # Daily at 20:00 UTC (04:00 the next day in Asia/Shanghai).
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-router-version
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.update.outputs.version }}
      entware: ${{ steps.release.outputs.entware }}
      openwrt: ${{ steps.release.outputs.openwrt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Check upstream and update package sources
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 script/update-version.py
      - name: Commit updated sources and prepare release tags
        id: release
        if: steps.update.outputs.upgrade_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPSTREAM_VERSION: ${{ steps.update.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$UPSTREAM_VERSION"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add entware/songloft/Makefile openwrt/songloft/Makefile
          if ! git diff --cached --quiet; then
            git commit -m "chore: update router packages to $version"
            git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          fi

          for platform in entware openwrt; do
            tag="$platform-$version"
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              # An existing release tag must continue to describe its original sources.
              if ! git diff --quiet "$tag" HEAD -- "$platform/songloft/Makefile"; then
                echo "::error::Sources differ from existing tag $tag; refusing to overwrite it"
                exit 1
              fi
            else
              git tag "$tag"
              git push origin "refs/tags/$tag"
            fi

            # Reached only after successfully upgrading the package version.
            # Listing failures stop the job instead of looking like a missing release.
            releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$tag\") | .draft")
            if [[ "$releases" == false ]]; then
              # Also retry cleanup if publishing previously succeeded but pruning failed.
              python3 script/prune-releases.py "$platform"
              echo "$platform=false" >> "$GITHUB_OUTPUT"
            else
              echo "$platform=true" >> "$GITHUB_OUTPUT"
            fi
          done

  entware:
    needs: check
    if: needs.check.outputs.entware == 'true'
    # GITHUB_TOKEN pushes do not trigger tag workflows; call the build directly.
    uses: ./.github/workflows/release-entware.yml
    with:
      tag: entware-${{ needs.check.outputs.version }}

  openwrt:
    needs: check
    if: needs.check.outputs.openwrt == 'true'
    uses: ./.github/workflows/release-openwrt.yml
    with:
      tag: openwrt-${{ needs.check.outputs.version }}
